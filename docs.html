const PAGES = [
  // ─── GRADE 1: BEGINNER ───
  { group: 'Grade 1 · Beginner', num: '1.1', id: 'what', title: 'What is 2D Engine Studio?', html: `
    <p><b>2D Engine Studio</b> is a complete game engine that lives in your browser. You build
    games by placing <b>objects</b> on a canvas, wiring up <b>variables</b>, and writing small
    <b>scripts</b> in JavaScript or Lua. When the game feels good, you press <b>Export</b> and get a
    single standalone <code>.html</code> file — your finished game, ready to send to anyone.</p>
    <h3>What kind of engine is it?</h3>
    <ul>
      <li>An <b>editor</b>, not an arcade. It ships empty on purpose — every game inside it is yours.
          (Earlier versions bundled demo games; they were removed so the studio is judged as a tool,
          not a gallery. All the capabilities those demos used are still in the engine, documented here.)</li>
      <li><b>2D first.</b> Sprites, physics, particles, cameras, scenes — plus CSS-3D tilt
          (rotX/rotY/z) on every object for fake-3D effects.</li>
      <li><b>Local & private.</b> Runs on your machine via a tiny PowerShell server
          (<code>start.bat</code> → <code>http://127.0.0.1:8000</code>). No accounts, no cloud,
          no analytics. Your projects live in your browser's IndexedDB.</li>
      <li><b>Free.</b> MIT licensed — see the License chapter.</li>
    </ul>
    <h3>The three pillars</h3>
    <table>
      <tr><th>Pillar</th><th>What it is</th><th>Chapter</th></tr>
      <tr><td><b>Objects</b></td><td>Everything visible or hittable: shapes, buttons, images, triggers, emitters…</td><td>2.1</td></tr>
      <tr><td><b>Variables</b></td><td>The game's memory: score, health, flags — bound to counters, bars, toggles</td><td>2.2</td></tr>
      <tr><td><b>Scripts</b></td><td>Code that runs on events: onStart, onUpdate, onClick, onKey, onScene</td><td>2.3</td></tr>
    </table>
    <h3>What can you build?</h3>
    <p>Clickers, platformers, puzzle games, shooters, card games, racing (fake-3D), tower
    defense, breakout, snake, flappy — anything 2D that fits in a browser tab. The
    Limitations chapter is honest about what does <i>not</i> fit (multiplayer, true 3D).</p>` },

  { group: 'Grade 1 · Beginner', num: '1.2', id: 'install', title: 'Installing & starting', html: `
    <h3>Requirements</h3>
    <ul><li>Windows 10/11 (PowerShell is built in) · any modern Chromium browser (Chrome/Edge).</li>
        <li>That's it. No Python, no Node, no installs. (Python is only a fallback in <code>start.bat</code>.)</li></ul>
    <h3>Start</h3>
    <pre>double-click  start.bat
→ a console window opens, the browser opens http://127.0.0.1:8000
→ close the console window to stop the studio</pre>
    <p>The server is <code>serve.ps1</code>, a ~60-line PowerShell HTTP listener. It:</p>
    <ul>
      <li>binds <b>127.0.0.1 only</b> — nothing on your network can reach it;</li>
      <li>blocks path traversal and drive-letter tricks (403/400);</li>
      <li>hides <code>.git</code> and sends <code>Cache-Control: no-store</code> so you always
          get the latest code after an update (if something looks wrong, still Ctrl+Shift+R).</li>
    </ul>
    <h3>Your data & ownership</h3>
    <p>Projects save automatically in browser <b>IndexedDB</b> (<code>2dengine-studio</code>).
    The dashboard's <b>Data ▾</b> menu gives you full ownership:</p>
    <ul>
      <li><b>Download all data</b> — every project as one JSON file (keep backups!);</li>
      <li><b>Import data</b> — restores a backup without overwriting existing projects;</li>
      <li><b>Delete ALL projects</b> — with confirmation;</li>
      <li>each card's <b>Download Game</b> exports that game as standalone HTML directly.</li>
    </ul>
    <div class="callout warn">Browser “clear browsing data” also clears your projects.
    The JSON backup is your safety net.</div>` },

  { group: 'Grade 1 · Beginner', num: '1.3', id: 'tour', title: 'The editor tour', html: `
    <ul>
      <li><b>Top bar</b> — project name · save/undo/redo · <b>▶ Play</b> · restart · <b>■ Stop</b> ·
          play-in-window · <b>&lt;/&gt; Scripts</b> · <b>⤒ Export</b> · ⚙ settings.</li>
      <li><b>Left palette</b> — the 13 object types. Drag one onto the canvas (or right-click the canvas).</li>
      <li><b>Scene / Game tabs</b> — Scene is the workshop (grid, selection, zoom); Game is the live game.</li>
      <li><b>Scene pills</b> — <code>main +</code>: multiple scenes/levels; each object belongs to one.</li>
      <li><b>Explorer</b> — all objects & script hooks, searchable; right-click rows for
          duplicate / delete / group / bring-to-front.</li>
      <li><b>Properties</b> — the inspector for the selection: transform, style, physics,
          bindings, custom fields.</li>
      <li><b>Bottom dock</b> — Variables · Events · Assets · Console. Console shows your

    </ul>
    <h3>Controls cheat</h3>
    <table>
      <tr><th>Action</th><th>How</th></tr>
      <tr><td>Add object</td><td>drag from palette, or right-click canvas</td></tr>
      <tr><td>Multi-select</td><td>Shift+click, or drag a selection box</td></tr>
      <tr><td>Group / ungroup</td><td>right-click selection → Group</td></tr>
      <tr><td>Duplicate / delete</td><td>Ctrl+D / Del</td></tr>
      <tr><td>Undo / redo</td><td>Ctrl+Z / Ctrl+Y (50 steps)</td></tr>
      <tr><td>Zoom</td><td>toolbar 25%…400% in ¼ steps — always sharp</td></tr>
      <tr><td>Nudge</td><td>arrow keys (Shift = 10px); groups move together</td></tr>
    </table>` },

  // ─── GRADE 2: CORE ───
  { group: 'Grade 2 · Core', num: '2.1', id: 'objects', title: 'Objects', html: `
    <p>Every object shares: <b>name</b> (how scripts find it), <b>x/y/w/h</b>, <b>scene</b>,
    <b>layer</b>, <b>visible</b>, plus style extras (border, radius, shadow, opacity,
    rotation, <b>rotX/rotY/z</b>, tags, custom fields). Physics fields (<b>gravity, vx, vy,
    bounce</b>) exist on <i>every</i> type.</p>
    <table>
      <tr><th>Type</th><th>Purpose</th><th>Notable fields</th></tr>
      <tr><td><b>button</b></td><td>Clickable action; can carry a cost and buy</td><td>text, cost, costVarId</td></tr>
      <tr><td><b>text</b></td><td>Label; binds to a variable and formats it</td><td>text, variableId, prefix</td></tr>
      <tr><td><b>image</b></td><td>Uploaded art (PNG/JPG/SVG); also canvas backgrounds</td><td>src, fit</td></tr>
      <tr><td><b>panel</b></td><td>Styled box for UI clusters (group it!)</td><td>bg, radius</td></tr>
      <tr><td><b>progressbar</b></td><td>Fills according to a variable vs max</td><td>valueVarId, maxValue</td></tr>
      <tr><td><b>counter</b></td><td>Live number display</td><td>variableId, prefix</td></tr>
      <tr><td><b>shape</b></td><td>rect / ellipse / triangle / line — the workhorse sprite</td><td>kind + full physics</td></tr>
      <tr><td><b>input</b></td><td>Player text entry</td><td>placeholder; read via <code>value()</code></td></tr>
      <tr><td><b>slider</b></td><td>Drag-value; writes into a variable</td><td>min, max, variableId</td></tr>
      <tr><td><b>toggle</b></td><td>On/off switch bound to a variable — numbers flip <b>0↔1</b></td><td>variableId</td></tr>
      <tr><td><b>timer</b></td><td>Countdown/stopwatch; fires onExpire</td><td>seconds, autoStart</td></tr>
      <tr><td><b>trigger</b></td><td>Invisible zone running code on entry</td><td>targetName, mode: once/every/enter</td></tr>
      <tr><td><b>emitter</b></td><td>Continuous particle fountain</td><td>rate, life, speed, angle, spread, colors</td></tr>
    </table>
    <div class="callout">Naming matters: scripts call <code>obj("Player")</code>. The Explorer
    search and right-click menus make renames painless. Duplicate names are auto-avoided.</div>` },

  { group: 'Grade 2 · Core', num: '2.2', id: 'variables', title: 'Variables', html: `
    <p>Bottom dock → <b>Variables</b> → <i>+ Add Variable</i>. Types: <b>number</b> and <b>text</b>.
    The “Used in” column counts which scripts reference each one.</p>
    <h3>Script side</h3>
    <pre>set("Score", 0)          get("Score")           add("Score", 10)
set("Name", "Zed")       has("Score")           toggleVar("PowerOn")</pre>
    <h3>Object side (zero code)</h3>
    <ul>
      <li><b>counter / text</b> display a variable live;</li>
      <li><b>progressbar</b> = variable ÷ maxValue;</li>
      <li><b>slider / toggle</b> write into a variable (toggle on a number flips 0↔1 —
          a light switch made of math);</li>
      <li><b>button</b> with cost fields spends a variable and fires its click script only
          when affordable. There is no special “upgrade object” — it's a button + variables,
          which means you can have any economy you want.</li>
    </ul>
    <div class="callout good">Golden rule: the <b>variable</b> is the truth, the object is a
    window onto it. Scripts change variables; bound objects update themselves.</div>` },

  { group: 'Grade 2 · Core', num: '2.3', id: 'scripting', title: 'Scripting (JS & Lua)', html: `
    <p>Press <b>&lt;/&gt; Scripts</b>. Game hooks:</p>
    <table>
      <tr><th>Hook</th><th>Fires</th><th>Extras</th></tr>
      <tr><td><code>onStart</code></td><td>once per (re)start</td><td>init your variables here</td></tr>
      <tr><td><code>onUpdate</code></td><td>every frame</td><td><code>dt</code> = seconds since last frame</td></tr>
      <tr><td><code>onClick</code></td><td>stage click</td><td><code>x</code>, <code>y</code></td></tr>
      <tr><td><code>onKey</code></td><td>key press</td><td><code>key</code></td></tr>
      <tr><td><code>onScene</code></td><td>after gotoScene()</td><td><code>to</code>, <code>from</code> (not on boot)</td></tr>
    </table>
    <p>Object hooks (per-object code): <code>init · click · update · hover · unhover · enter · exit</code>.</p>
    <h3>API you get in every script</h3>
    <pre>obj(name)  objects()  tagged(tag)  spawn(type, props)  destroy(o)
hide(o) show(o) setText(o,t) moveTo(o,x,y) moveBy(o,dx,dy) setSize(o,w,h)
setColor(o,css) setOpacity(o,v) bring(o)
collide(a,b) hits(a,b) onGround(o) vel(o)
pressed("ArrowLeft")  key("w")  mouse.x mouse.y mouse.down mouse.justDown
cam.moveTo(x,y)  cam.follow(o, stiff)  cam.zoom
emit(x,y,n,{color,speed,life})  gotoScene(name)  beep(freq,ms)  play(file)
set get add print …  and your own variables by name</pre>
    <h3>Lua</h3>
    <p>The Scripts editor has a language switch (per project). Lua exposes the identical API:</p>
    <pre>function onUpdate(dt)
  if pressed("Space") and onGround("Player") then
    obj("Player").vy = -520
  end
end</pre>
    <h3>Blocks (no-code)</h3>
    <p>The <b>Events</b> tab builds the same behavior from trigger→condition→action blocks;
    blocks compile down to the same runtime calls scripts use.</p>
    <div class="callout warn">Safety nets: an <code>onUpdate</code> that errors is
    <b>disabled after 5 bad frames</b> with a console hint (Reset or a code edit re-arms it);
    object scripts disable after one error; the console collapses repeats into ×N so spam
    can't flood you. The classic cause of <code>Unknown object</code> is deleting an object
    while a script still references it — or referencing an object you forgot to create.</div>` },

  // ─── GRADE 3: WORLD ───
  { group: 'Grade 3 · World', num: '3.1', id: 'physics', title: 'Physics & collisions', html: `
    <p>Set on any object via Inspector or scripts:</p>
    <ul>
      <li><b>gravity</b> px/s² (1400 feels good for platformers), <b>vx/vy</b> velocity,
          <b>bounce</b> off world edges and bodies.</li>
      <li><b>collide(a,b)</b> — overlapping right now; <b>hits(a,b)</b> — true only on the
          first frame of contact (coins!); <b>onGround(o)</b> — resting on something.</li>
      <li>Depenetration is real: an object spawned inside a floor is pushed out, and scene
          entry re-checks it so you never teleport into solid ground.</li>
      <li>Cost: ~2 ms/frame for 50 bodies. Boxes only — no per-pixel, no joints/ropes.</li>
    </ul>
    <h3>Platformer recipe</h3>
    <pre>onStart:  set("Lives", 3);  cam.follow(obj("Player"), 8)
onUpdate: if pressed("ArrowLeft")  then obj("Player").vx = -260
          if pressed("ArrowRight") then obj("Player").vx =  260
          if key("Space") and onGround("Player") then obj("Player").vy = -520
onUpdate: if hits("Player", "Coin") then add("Score", 1); destroy(obj("Coin")) end</pre>` },

  { group: 'Grade 3 · World', num: '3.2', id: 'camera', title: 'Camera, scenes & groups', html: `
    <h3>Camera</h3>
    <p>The <b>stage</b> (Settings → width/height) is your world; the viewport is the window.
    <code>cam.moveTo(x,y)</code> teleports, <code>cam.follow(obj, stiffness)</code> chases,
    <code>cam.zoom</code> is quantized to stay sharp. Objects outside view are culled.</p>
    <h3>Scenes</h3>
    <p>Scene pills above the canvas: <code>main +</code>. Each object belongs to a scene;
    only the active scene renders. <code>gotoScene("cave")</code> switches (from scripts or a
    trigger's action). Tick <b>persist</b> on an object (your player!) and it travels between
    scenes. The first scene is the boot scene; <code>onScene</code> fires on real switches,
    not on boot.</p>
    <h3>Groups</h3>
    <p>Select several objects → right-click → <b>Group</b>. Clicking any member selects all;
    nudging, rotating and proportional scaling apply to the whole group with one pivot.
    Vehicles, castles, HUD clusters. <b>Ungroup</b> anytime.</p>` },

  { group: 'Grade 3 · World', num: '3.3', id: 'fx', title: 'Particles, triggers & sound', html: `
    <h3>Emitters & emit()</h3>
    <pre>emit(200, 400, 12, { color: "#7df9ff", speed: 90, life: 0.5 })</pre>
    <p>Emitter objects puff continuously (rate/life/speed/angle/spread/colors). Budget:
    keep <b>live particles under ~260</b> — the pool is DOM-based; bursts beat streams.</p>
    <h3>Triggers</h3>
    <p>Invisible zones with modes <b>once</b> (checkpoint), <b>every</b> (respawn),
    <b>enter</b> (door). Actions: run script, change scene, set variables.</p>
    <h3>Sound</h3>
    <p><code>beep(freq, ms)</code> for retro pings; upload audio in Assets and
    <code>play("file.mp3")</code>. Volume/mute in Settings. One channel per sound —
    no mixing.</p>
    <h3>Touch</h3>
    <p>Automatic: taps map to mouse events, so exported games play on phones with no extra work.</p>` },

  // ─── GRADE 4: SHIP IT ───
  { group: 'Grade 4 · Ship it', num: '4.1', id: 'export', title: 'Exporting & publishing', html: `
    <p><b>⤒ Export</b> produces one standalone HTML file (~85 KB + your assets): the same
    runtime class, none of the editor. It works offline from a USB stick, e-mail, Discord
    or itch.io. Uploaded images/audio are embedded as data URLs.</p>
    <ul>
      <li>Dashboard cards also have <b>Download Game</b> — export without opening the editor.</li>
      <li>Exported games keep <b>Save/Load slots</b> (localStorage per project id).</li>
      <li><b>Hosting caveat</b>: the script compiler uses <code>new Function</code>, so hosts with
          strict CSP (<code>unsafe-eval</code> blocked) will refuse it. itch.io and normal static
          hosts are fine; locked-down school networks may not be.</li>
    </ul>` },

  // ─── ELECTIVES ───
  { group: 'Electives', num: 'E.1', id: 'ideas', title: 'Ideas to build (ladder)', html: `
    <h3>Easy — learn the loop</h3>
    <ul><li><b>Clicker</b>: button + cost fields + counter + progressbar. One variable.</li>
        <li><b>Reaction test</b>: timer + onKey + text.</li>
        <li><b>Dice / coinflip</b>: <code>spawn</code>… no — <code>Math.random()</code> + setText.</li></ul>

        <li><b>Flappy</b>: gravity + tap impulse + pipe spawner (emitter of shapes? no — <code>spawn()</code> in onUpdate).</li>
        <li><b>Breakout</b>: hits() + destroy + score variable.</li>
        <li><b>Snake</b>: array in a variable, grid math, one shape per segment.</li></ul>

    <ul><li><b>Platformer</b>: cam.follow + triggers + scenes + persist flag.</li>
        <li><b>Fake-3D racer</b>: rows of shapes with rotX + speed-scaled z.</li>
        <li><b>Tower defense</b>: groups for turrets, emitters for muzzle flash, timers for waves.</li>
        <li><b>Card game</b>: rotY flips with CSS-3D — the easter egg's tech, for real.</li></ul>` },

const $ = s => document.querySelector(s);
const byId = id => PAGES.find(p => p.id === id);
let cur = 0;

function renderToc() {
  const groups = {};
  PAGES.forEach((p, i) => { (groups[p.group] = groups[p.group] || []).push([p, i]); });
  let html = '';
  for (const [g, list] of Object.entries(groups)) {
    html += '<div class="toc-group"><h3>' + g + '</h3>';
    for (const [p, i] of list) {
      html += '<button class="toc-btn' + (i === cur ? ' on' : '') + '" data-i="' + i + '">' +
        '<span class="num">' + p.num + '</span>' + p.title + '</button>';
    }
    html += '</div>';
  }
  $('#toc').innerHTML = html;
  $('#toc').querySelectorAll('.toc-btn').forEach(b => b.addEventListener('click', () => open(+b.dataset.i)));
}
function open(i) {
  cur = i;
  const p = PAGES[i];
  $('#page').innerHTML = '<div class="page"><h2>' + p.title +
    ' <span style="font-size:12px;color:var(--dim)">' + p.num + '</span></h2>' + p.html +
    '<div class="pager"></div></div>';
  const pager = $('.pager');
  if (i > 0) { const b = document.createElement('button'); b.textContent = '← ' + PAGES[i - 1].title; b.onclick = () => open(i - 1); pager.append(b); }
  if (i < PAGES.length - 1) { const b = document.createElement('button'); b.textContent = PAGES[i + 1].title + ' →'; b.onclick = () => open(i + 1); pager.append(b); }
  location.hash = p.id;
  renderToc();
  window.scrollTo(0, 0);
}
renderToc();
open(byId(location.hash.slice(1)) ? PAGES.indexOf(byId(location.hash.slice(1))) : 0);

// License text: fetch once, fill whenever the license page is shown.
let LICENSE_TEXT = null;
fetch('LICENSE').then(r => r.ok ? r.text() : Promise.reject())
  .then(t => { LICENSE_TEXT = t.trim(); fillLicense(); })
  .catch(() => { LICENSE_TEXT = 'MIT License — see the LICENSE file in the studio folder.'; fillLicense(); });
function fillLicense() {
  const pre = document.getElementById('license-text');
  if (pre && LICENSE_TEXT !== null) pre.textContent = LICENSE_TEXT;
}
const _open = open;
open = function (i) { _open(i); fillLicense(); };
