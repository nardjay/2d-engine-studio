<script>
// The complete Handbook. Every function, field and quirk documented here was
// read out of the engine source (runtime.js / model.js / editor) — nothing invented.
const PAGES = [
  // ════════════ PART 1 — INTRODUCTION ════════════
  { group: 'Part 1 · Introduction', num: '1', id: 'what', title: 'What is 2D Engine Studio?', html: `
    <p><b>2D Engine Studio</b> is a complete, browser-based game engine with a full editor —
    built by <b>Jaynard</b>. You place <b>objects</b> on a canvas, define <b>variables</b>,
    write <b>scripts</b> in JavaScript or Lua, press Play, and Export a single standalone
    <code>.html</code> file: your finished game, ready to send to anyone.</p>
    <h3>What kind of engine is it?</h3>
    <ul>
      <li>An <b>editor, not an arcade</b>. It ships empty on purpose — every game inside it is
          yours. Earlier versions bundled demo games to prove the engine could do real work
          (physics, cameras, particles, scenes); those were removed so the studio is judged as
          a tool. Every capability the demos used is still in the engine and documented here.</li>
      <li><b>2D first, with CSS-3D powers</b>: every object has <code>rotX</code>,
          <code>rotY</code> and <code>z</code> — real 3D transforms for card flips, tilted
          signs and fake-3D racers, plus <code>cam.persp()</code> for perspective.</li>
      <li><b>Local &amp; private</b>: runs from <code>start.bat</code> on
          <code>127.0.0.1:8000</code> only. No accounts, no cloud, no analytics, no external
          calls. Projects live in your browser's IndexedDB.</li>
      <li><b>Free forever</b>: MIT licensed (see License chapter). Games you make are 100% yours.</li>
    </ul>
    <h3>The three pillars</h3>
    <table>
      <tr><th>Pillar</th><th>What it is</th><th>Chapter</th></tr>
      <tr><td><b>Objects</b></td><td>Everything visible or hittable — 13 types, all scriptable, all physical</td><td>3</td></tr>
      <tr><td><b>Variables</b></td><td>The game's memory: number &amp; boolean, bound to displays</td><td>4</td></tr>
      <tr><td><b>Scripts &amp; Events</b></td><td>Code on hooks (JS/Lua) or no-code event blocks</td><td>5</td></tr>
    </table>
    <h3>What can you build?</h3>
    <p>Clickers, platformers, puzzle games, breakout, snake, flappy, shooters, card games,
    racing (fake-3D), tower defense, quiz games, visual novels — anything 2D that fits in a
    browser tab. The Limitations chapter is honest about what does <i>not</i> fit
    (multiplayer, true 3D, per-pixel collision).</p>` },

  { group: 'Part 1 · Introduction', num: '2', id: 'install', title: 'Installing & starting', html: `
    <h3>Requirements</h3>
    <ul><li>Windows 10/11 (PowerShell is built in) · Chrome or Edge.</li>
        <li>No Python, no Node, no installs. Python appears only as a fallback inside
            <code>start.bat</code> for machines where PowerShell is locked down.</li></ul>
    <h3>Start</h3>
    <pre>double-click  start.bat
→ console window opens · browser opens http://127.0.0.1:8000
→ close the console window to stop the studio</pre>
    <h3>The server (<code>serve.ps1</code>) — security notes</h3>
    <ul>
      <li>Binds <b>127.0.0.1 only</b> — nothing on your network can reach it.</li>
      <li>Blocks path traversal in every tested form: <code>..%2f</code>, double-encoded,
          drive letters (<code>/C:/...</code>), NUL bytes → 400/403/404.</li>
      <li>Hides <code>.git</code> and sends <code>Cache-Control: no-store</code> — you always
          get the latest code after an update. (If a tab was open before an update, hit
          <b>Ctrl+Shift+R</b> once.)</li>
    </ul>
    <h3>Your data &amp; ownership</h3>
    <p>Projects auto-save to IndexedDB store <code>2dengine-studio</code>. Game saves live in
    localStorage as <code>2dengine-studio-save:&lt;project&gt;:&lt;slot&gt;</code>. The dashboard's
    <b>Data ▾</b> menu gives you full ownership:</p>
    <ul>
      <li><b>Download all data</b> — every project as one versioned JSON file (keep backups!);</li>
      <li><b>Import data</b> — restores a backup; existing projects are never overwritten;</li>
      <li><b>Delete ALL projects</b> — the nuclear option, with confirmation;</li>
      <li>every project card's <b>Download Game</b> exports that game as standalone HTML without opening it.</li>
    </ul>
    <div class="callout warn">Browser “clear browsing data” also clears your projects.
    The JSON backup is your safety net.</div>` },

  // ════════════ PART 2 — THE EDITOR ════════════
  { group: 'Part 2 · The Editor', num: '3', id: 'tour', title: 'Editor tour', html: `
    <ul>
      <li><b>Top bar</b> — project name · save/undo/redo · <b>▶ Play</b> · restart · <b>■ Stop</b> ·
          play-in-window · <b>&lt;/&gt; Scripts</b> · <b>⤒ Export</b> · ⚙ settings.</li>
      <li><b>Left palette</b> — the 13 object types; drag onto the canvas or right-click the canvas.</li>
      <li><b>Scene / Game tabs</b> — Scene is the workshop (grid, selection, zoom);
          Game is the live running game inline.</li>
      <li><b>Scene pills</b> — <code>main +</code>: multiple scenes/levels, each with its own
          size &amp; background.</li>
      <li><b>Explorer</b> — every object &amp; script hook, searchable (“name, type”),
          windowed past 300 loose objects with a “Show all” escape hatch; right-click rows for
          duplicate / delete / group / bring-to-front. Selecting a hook opens its script.</li>
      <li><b>Properties (Inspector)</b> — the full field set for the selection (see chapter 4).</li>
      <li><b>Bottom dock</b> — <b>Variables</b> · <b>Events</b> · <b>Assets</b> · <b>Console</b>.
          Splitters: drag panel edges to resize. The Console shows <code>log()</code> output and
          errors; identical lines collapse into ×N counters.</li>
      <li><b>Session restore</b> — close the tab mid-project and the studio reopens it where
          you left off.</li>
    </ul>
    <h3>Controls cheat</h3>
    <table>
      <tr><th>Action</th><th>How</th></tr>
      <tr><td>Add object</td><td>drag from palette, or right-click canvas</td></tr>
      <tr><td>Multi-select</td><td>Shift+click, or drag a selection box (lasso)</td></tr>
      <tr><td>Select whole group</td><td>click any member once grouped</td></tr>
      <tr><td>Duplicate / delete</td><td>Ctrl+D / Del (multi-delete works)</td></tr>
      <tr><td>Undo / redo</td><td>Ctrl+Z / Ctrl+Y — 50 steps</td></tr>
      <tr><td>Nudge</td><td>arrow keys, Shift = 10px; groups nudge together</td></tr>
      <tr><td>Zoom</td><td>25%…400% in ¼ steps — sprites stay sharp, never blurry</td></tr>
      <tr><td>Context menus</td><td>right-click: canvas, objects, Explorer rows, dashboard cards, asset tiles</td></tr>
    </table>` },

  // ════════════ PART 3 — OBJECTS ════════════
  { group: 'Part 3 · Objects', num: '4', id: 'fields', title: 'Every field, explained', html: `
    <p>Every object carries these fields (Inspector sections in brackets):</p>
    <table>
      <tr><th>Field</th><th>Meaning</th><th>Notes</th></tr>
      <tr><td><code>name</code></td><td>How scripts find it: <code>obj("Ship")</code></td><td>duplicates auto-renamed</td></tr>
      <tr><td><code>x, y, w, h</code></td><td>Position &amp; size in stage pixels</td><td>grid-snapped on drag</td></tr>
      <tr><td><code>rotation</code></td><td>2D spin in degrees</td><td>group members rotate together</td></tr>
      <tr><td><code>rotX, rotY, z</code></td><td><b>CSS-3D tilt &amp; depth</b></td><td>with <code>cam.persp()</code>: real perspective</td></tr>
      <tr><td><code>visible</code></td><td>Show/hide (script: <code>hide()/show()</code>)</td><td></td></tr>
      <tr><td><code>opacity</code></td><td>0…1</td><td></td></tr>
      <tr><td><code>layer</code></td><td>Stack order (bring() pushes to front)</td><td></td></tr>
      <tr><td><code>scene</code></td><td>Which scene owns it</td><td>only active scene renders</td></tr>
      <tr><td><code>persist</code></td><td>Travels across scenes</td><td>tick it for the player!</td></tr>
      <tr><td><code>groupId</code></td><td>Group membership</td><td>set via right-click → Group</td></tr>
      <tr><td><code>gravity, vx, vy, bounce</code></td><td>Physics — <b>on every type</b></td><td>see Motion chapter</td></tr>
      <tr><td><code>tags</code></td><td>Labels for <code>tagged("enemy")</code></td><td></td></tr>
      <tr><td>custom fields</td><td>Your own key/value extras per object</td><td>readable via <code>setProperty</code>/direct</td></tr>
    </table>
    <h3>Style extras</h3>
    <p>border color+width, corner radius, shadow, background color (any CSS), text color,
    font size, bold/italic, alignment — all in the Inspector, all live.</p>` },

  { group: 'Part 3 · Objects', num: '5', id: 'types', title: 'The 13 object types', html: `
    <table>
      <tr><th>Type</th><th>Purpose</th><th>Own fields</th></tr>
      <tr><td><b>button</b></td><td>Clickable action; can carry a cost and buy</td><td>text, cost, costVarId — click only fires when affordable, and it spends the variable</td></tr>
      <tr><td><b>text</b></td><td>Label; can bind to a variable</td><td>text, variableId, prefix/suffix</td></tr>
      <tr><td><b>image</b></td><td>Uploaded art (PNG/JPG/SVG/GIF)</td><td>assetId, fit (cover/contain/tile)</td></tr>
      <tr><td><b>panel</b></td><td>Styled box for UI clusters</td><td>bg, radius, border</td></tr>
      <tr><td><b>progressbar</b></td><td>Fills variable ÷ max</td><td>valueVarId, maxValue, fillColor</td></tr>
      <tr><td><b>counter</b></td><td>Live number display</td><td>variableId, prefix</td></tr>
      <tr><td><b>shape</b></td><td>The workhorse sprite</td><td>kind: rect / ellipse / triangle / line</td></tr>
      <tr><td><b>input</b></td><td>Player text entry</td><td>placeholder; read with <code>obj("Name").value</code></td></tr>
      <tr><td><b>slider</b></td><td>Drag-value</td><td>min, max, variableId — writes into the variable</td></tr>
      <tr><td><b>toggle</b></td><td>On/off switch bound to a variable</td><td>boolean flips true/false; <b>number flips 0↔1</b> (text-bound = refused with a console note)</td></tr>
      <tr><td><b>timer</b></td><td>Countdown or stopwatch display</td><td>seconds, mode (countdown/stopwatch), autoStart, running; scripts: <code>timerStart/Stop/Set</code>, read <code>obj("T").seconds</code></td></tr>
      <tr><td><b>trigger</b></td><td>Invisible zone watching one target object</td><td>targetName; fires its <b>enter</b>/<b>exit</b> scripts when the target crosses (editor-only: never renders in game)</td></tr>
      <tr><td><b>emitter</b></td><td>Continuous particle fountain</td><td>rate, life, speed, angle, spread, size, colors (comma list)</td></tr>
    </table>
    <div class="callout">There is deliberately <b>no “upgrade button” type</b> — upgrades are
    a regular button + cost fields + variables. Any economy you can imagine is data, not code.</div>` },

  // ════════════ PART 4 — VARIABLES ════════════
  { group: 'Part 4 · Variables', num: '6', id: 'variables', title: 'Variables', html: `
    <p>Bottom dock → <b>Variables</b> → <i>+ Add Variable</i>. Types: <b>number</b> and
    <b>boolean</b> (values are coerced to the declared type automatically). The “Used in”
    column counts the scripts that reference each variable.</p>
    <h3>Script API</h3>
    <pre>set("Score", 0)        get("Score")           add("Score", 10)
subtract / multiply / increase / decrease     toggleVar("PowerOn")
has("Score")  → does the variable exist?      vars() → snapshot object of ALL variables
changed("Score") → did it change this frame?  (compare happens at frame start)</pre>
    <h3>Bound objects (zero code)</h3>
    <ul>
      <li><b>counter / text</b> display a variable live;</li>
      <li><b>progressbar</b> = variable ÷ maxValue;</li>
      <li><b>slider</b> writes its position into a variable;</li>
      <li><b>toggle</b> flips it (numbers flip 0↔1 — a light switch made of math);</li>
      <li><b>button</b> with cost fields spends it, and only clicks when affordable.</li>
    </ul>
    <div class="callout good">Golden rule: the <b>variable is the truth</b>, the object is a
    window onto it. Scripts change variables; bound displays update themselves — the runtime
    refreshes bound objects every frame automatically.</div>` },

  // ════════════ PART 5 — SCRIPTING ════════════
  { group: 'Part 5 · Scripting', num: '7', id: 'hooks', title: 'Hooks: where code runs', html: `
    <h3>Game-level scripts (the &lt;/&gt; Scripts editor)</h3>
    <table>
      <tr><th>Hook</th><th>Fires</th><th>Extras you get</th></tr>
      <tr><td><code>onStart</code></td><td>once when the game boots or resets</td><td>— (init your variables here)</td></tr>
      <tr><td><code>onUpdate</code></td><td>every frame</td><td><code>dt</code> = seconds since last frame (capped 0.1)</td></tr>
      <tr><td><code>onClick</code></td><td>stage click/tap</td><td><code>other</code> = the object clicked (live proxy) or null for empty space</td></tr>
      <tr><td><code>onKey</code></td><td>a key is pressed (not auto-repeat)</td><td><code>other</code> = the key name, lowercase</td></tr>
      <tr><td><code>onScene</code></td><td>after <code>gotoScene()</code> — <b>not</b> on boot</td><td><code>other</code> = the new scene name</td></tr>
    </table>
    <h3>Object-level scripts (per object, in the Inspector)</h3>
    <table>
      <tr><th>Hook</th><th>Fires</th></tr>
      <tr><td><code>init</code></td><td>once at game start, after onStart</td></tr>
      <tr><td><code>click</code></td><td>that object was clicked</td></tr>
      <tr><td><code>update</code></td><td>every frame (has <code>dt</code>)</td></tr>
      <tr><td><code>hover</code> / <code>unhover</code></td><td>mouse enters / leaves the object</td></tr>
      <tr><td><code>enter</code> / <code>exit</code></td><td>on a <b>trigger</b>: target crosses in / out — <code>other</code> = the crossing object</td></tr>
    </table>
    <p>In any script you also always get <code>dt</code> (0 outside update hooks),
    <code>time</code> (game clock), and <code>self</code> — in game scripts it's the invisible
    "Game" brain object (a real object: it can hold custom fields and object scripts),
    in object scripts it's that object itself. Writing <code>self.x</code> moves it live.
    <code>cancel()</code> aborts a button click (e.g. can't afford).</p>
    <div class="callout warn">Safety nets, verified in source: an <code>onUpdate</code> that
    errors is <b>disabled after 5 bad frames</b> with a console hint; object scripts disable
    after one error; identical console errors collapse into ×N. <b>Reset or editing the code
    re-arms everything.</b> Classic cause of <code>Unknown object</code>: a script referencing
    an object you deleted — or never created.</div>` },

  { group: 'Part 5 · Scripting', num: '8', id: 'api', title: 'The COMPLETE script API', html: `
    <p>Every function below exists in the runtime, verified by name from the source.
    Both JavaScript and Lua get the identical set. <code>sel</code> = object name, id, or
    object from <code>obj()</code>.</p>
    <h3>Variables</h3>
    <pre>set(name, value)   get(name)   add(name, n)   subtract(name, n)
multiply(name, n)  increase(name, n=1)  decrease(name, n=1)
toggleVar(name)  has(name)  vars()  changed(name)</pre>
    <h3>Finding objects</h3>
    <pre>obj(sel)        → live proxy; throws "Unknown object: X" if missing
objects()       → array of all live proxies
tagged(tag)     → objects with that tag
clone(sel)      → duplicate object into the project (new id, same scene)
objIndex()      → the internal name/id Map (advanced)</pre>
    <h3>Controlling objects</h3>
    <pre>hide(sel) show(sel) toggleVisible(sel)
setText(sel, text)  moveTo(sel, x, y)  moveBy(sel, dx, dy)
setSize(sel, w, h)  setColor(sel, css)  setTextColor(sel, css)
setOpacity(sel, 0..1)  setProperty(sel, prop, value)  bring(sel)
destroy(sel)  spawn(type, {x, y, w, h, ...props})   → new object in current scene
timerStart(sel) timerStop(sel) timerSet(sel, seconds)</pre>
    <h3>Motion &amp; collision</h3>
    <pre>touching(a, b) → true while the two boxes overlap
// velocity & gravity are plain fields: obj("P").vy = -520, .vx, .gravity, .bounce
// bounce clamps at world edges and zeroes tiny bounces (rest threshold 25)</pre>
    <h3>Camera &amp; view</h3>
    <pre>cam.follow(target, smooth=5)   cam.unfollow()   cam.moveTo(x, y)
cam.shake(mag=8)               cam.persp(distance=800)
cam.x  cam.y                   (read/write the camera position)
view() → { width, height, scenes, scene, worldWidth, worldHeight }</pre>
    <h3>Input</h3>
    <pre>pressed("space")   → true only the frame the key went down (edge)
key("w")           → true while held
mouse.x  mouse.y  mouse.down      (stage coordinates, always safe to read)
// touch = mouse: taps drive the same fields on phones</pre>
    <h3>World</h3>
    <pre>gotoScene(name)   currentScene()   restart()   // restart = replay from onStart</pre>
    <h3>FX &amp; audio</h3>
    <pre>emit(x, y, count=12, {color, speed, life, size})   // burst; hard cap 260 live particles
beep(freq=440, ms=80)          // WebAudio retro ping
play(assetName, vol=1)         // uploaded mp3/wav</pre>
    <h3>Random &amp; math helpers</h3>
    <pre>rand(min, max)  randInt(min, max)  chance(p)  pick(array)
clamp(v, min, max)  len(x)  pcall(fn) → [ok, result|error]</pre>
    <h3>Console &amp; flow</h3>
    <pre>log(...)  warn(...)  error(msg)        // → Console tab (log is print in Lua)
wait(seconds)   // async: await wait(1) inside a script
dt   time       // frame delta & game clock, available in update hooks</pre>
    <div class="callout good">The Scripts editor autocompletes all of this as you type.
    The Explorer's script rows show which hook holds code at a glance.</div>` },

  { group: 'Part 5 · Scripting', num: '9', id: 'lua', title: 'Lua', html: `
    <p>One switch in the Scripts editor changes the whole project's language. Lua runs
    through the studio's own transpiler onto the same engine — <b>identical API</b>:</p>
    <pre>function onUpdate(dt)
  if pressed("arrowleft") then obj("Ship").x = obj("Ship").x - 300 * dt end
  if key("space") and touching("Player", "Ground") then obj("Player").vy = -520 end
  if chance(0.02) then emit(mouse.x, mouse.y, 8, { color = "#7df9ff" }) end
end</pre>
    <ul>
      <li><code>print(x)</code> maps to <code>log(x)</code> — same console.</li>
      <li>Table/object syntax: <code>{ color = "#fff" }</code> instead of <code>{color:"#fff"}</code>.</li>
      <li>Same hooks, same live objects, same variables, works in exports too.</li>
    </ul>
    <div class="callout">Mixed-language projects aren't a thing — one language per project,
    chosen in the editor corner. Both are first-class.</div>` },

  { group: 'Part 5 · Scripting', num: '10', id: 'events', title: 'Event blocks (no-code)', html: `
    <p>The <b>Events</b> tab builds behavior without syntax. An event = trigger + optional

    <ul>
      <li><b>Triggers:</b> On Click (on a chosen object) · On Game Start.</li>
      <li><b>Conditions:</b> variable <code>&gt; &lt; = ≥ ≤ ≠</code> value — all must pass.</li>
      <li><b>Actions (the complete list):</b>
        <pre>add / subtract / multiply / set  → variable
updateText                       → text object
show / hide                      → object
setProperty                      → opacity, rotation, x, y, w, h,
                                   radius, borderWidth, bg, color, fillColor
run code                         → a JS snippet (escape hatch)</pre></li>

    </ul>` },

  // ════════════ PART 6 — MOTION & WORLD ════════════
  { group: 'Part 6 · Motion & World', num: '11', id: 'physics', title: 'Physics & collision', html: `
    <h3>The model (straight from the source)</h3>
    <ul>
      <li>Each frame, for every object with gravity/velocity:
          <code>vy += gravity * dt</code>, then <code>x += vx*dt</code>, <code>y += vy*dt</code>.</li>
      <li><b>gravityScale</b> (Settings) multiplies all gravity — tune the whole game at once.</li>
      <li><b>bounce</b> reflects off the <b>world edges</b> (worldWidth/worldHeight, bigger than
          the stage if you set it): floor bounce keeps 62% energy, side walls 80%; bounces under
          25 px/s settle to rest (that's your “grounded” trick: <code>obj("P").vy == 0</code>
          while gravity is on and touching something below).</li>
      <li><b>touching(a,b)</b> = box overlap, checked live. No per-pixel, no rotation-aware
          boxes — honest rectangles.</li>
      <li><b>Triggers</b> watch one named target crossing their box (enter/exit scripts,
          <code>other</code> = the crosser). This is the “level logic” tool.</li>
      <li>Depenetration: bodies spawned inside a floor are lifted out at scene entry, and
          anything falling far below the world is recycled to the top (respawn behavior).</li>
    </ul>
    <h3>Platformer recipe (verified pattern)</h3>
    <pre>onStart:  set("Lives", 3);  cam.follow(obj("Player"), 8)
onUpdate:
  obj("Player").vx = 0
  if pressed("arrowleft")  then obj("Player").vx = -260 end
  if pressed("arrowright") then obj("Player").vx =  260 end
  if key("space") and touching(obj("Player").id, obj("Ground").id) and obj("Player").vy >= 0 then
    obj("Player").vy = -520
  end</pre>
    <p>For one-way coins use a <b>trigger</b> per coin (enter → <code>add("Score",1); destroy(obj("Coin"))</code>)
    — that's edge-triggered by design, exactly what “collect once” needs.</p>` },

  { group: 'Part 6 · Motion & World', num: '12', id: 'camera', title: 'Camera, stage & world', html: `
    <p>Three rectangles matter: the <b>viewport</b> (what's on screen), the <b>stage</b>
    (Settings width/height — or per-scene size), and the <b>world</b> (worldWidth/Height,
    the physics bounds). The camera moves inside the stage.</p>
    <pre>cam.follow(obj("Player"), 8)  // 8 = stiffness; cam.unfollow() to stop
cam.moveTo(400, 300)          // teleport
cam.shake(12)                 // decaying rumble, purely visual
cam.persp(700)                // perspective distance for rotX/rotY/z 3D
view().worldWidth             // read the bounds</pre>
    <ul>
      <li>Off-screen objects are visibility-culled automatically (60px margin) — big worlds are cheap.</li>
      <li>Objects outside the camera show as edge markers in the Scene tab.</li>
      <li>HUD that must stay pinned: don't use cam — pin it to the stage corner instead.</li>

  { group: 'Part 6 · Motion & World', num: '13', id: 'scenes', title: 'Scenes', html: `

  { group: 'Part 6 · Motion & World', num: '14', id: 'groups', title: 'Groups', html: `

const $ = s => document.querySelector(s);
const byId = id => PAGES.find(p => p.id === id);
let cur = 0;

function renderToc() {
  const groups = {};
  PAGES.forEach((p, i) => { (groups[p.group] = groups[p.group] || []).push([p, i]); });
  let html = '';
  for (const [g, list] of Object.entries(groups)) {
    html += '<div class="toc-group"><h3>' + g + '</h3>';
    for (const [p, i] of list) {
      html += '<button class="toc-btn' + (i === cur ? ' on' : '') + '" data-i="' + i + '">' +
        '<span class="num">' + p.num + '</span>' + p.title + '</button>';
    }
    html += '</div>';
  }
  $('#toc').innerHTML = html;
  $('#toc').querySelectorAll('.toc-btn').forEach(b => b.addEventListener('click', () => open(+b.dataset.i)));
}
function open(i) {
  cur = i;
  const p = PAGES[i];
  $('#page').innerHTML = '<div class="page"><h2>' + p.title +
    ' <span style="font-size:12px;color:var(--dim)">' + p.num + '</span></h2>' + p.html +
    '<div class="pager"></div></div>';
  const pager = $('.pager');
  if (i > 0) { const b = document.createElement('button'); b.textContent = '← ' + PAGES[i - 1].title; b.onclick = () => open(i - 1); pager.append(b); }
  if (i < PAGES.length - 1) { const b = document.createElement('button'); b.textContent = PAGES[i + 1].title + ' →'; b.onclick = () => open(i + 1); pager.append(b); }
  location.hash = p.id;
  renderToc();
  fillLicense();
  window.scrollTo(0, 0);
}

// License text: fetch once, fill whenever the license page is shown.
let LICENSE_TEXT = null;
fetch('LICENSE').then(r => r.ok ? r.text() : Promise.reject())
  .then(t => { LICENSE_TEXT = t.trim(); fillLicense(); })
  .catch(() => { LICENSE_TEXT = 'MIT License — see the LICENSE file in the studio folder.'; fillLicense(); });
function fillLicense() {
  const pre = document.getElementById('license-text');
  if (pre && LICENSE_TEXT !== null) pre.textContent = LICENSE_TEXT;
}

renderToc();
open(byId(location.hash.slice(1)) ? PAGES.indexOf(byId(location.hash.slice(1))) : 0);
</script>
